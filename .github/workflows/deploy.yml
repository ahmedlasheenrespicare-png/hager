# Builds the dashboard, adds the LDEC 3D maquettes site under /ldec/,
# and deploys both to GitHub Pages automatically.
# Trigger: pushes to main or the Arena working branch (or manually).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/534da059-hager]
  workflow_dispatch:

# Permissions required by the official Pages deploy actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+ or 22.12+
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add LDEC 3D maquettes site
        run: |
          mkdir -p dist/ldec/assets
          cp scene/ldec-3d.html dist/ldec/index.html
          cp scene/ldec-3d.html dist/ldec/ldec-3d.html
          cp scene/ldec3d.js scene/ldec3d.css dist/ldec/
          cp scene/ldec-3d-standalone.html dist/ldec/standalone.html
          cp scene/ldec-gallery.html scene/ldec-models-gallery.html dist/ldec/
          cp -r scene/vendor dist/ldec/vendor
          cp -r scene/assets/fonts dist/ldec/assets/fonts
          cp scene/assets/ldec-* dist/ldec/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
