<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هاجر — رقصة على Good Life</title>
    <style>
      @font-face { font-family: "Cairo"; font-weight: 400; src: url("./assets/fonts/cairo-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 700; src: url("./assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 800; src: url("./assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 400; src: url("./assets/fonts/cairo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      @font-face { font-family: "Cairo"; font-weight: 700; src: url("./assets/fonts/cairo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      @font-face { font-family: "Cairo"; font-weight: 800; src: url("./assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #1c1420; font-family: "Cairo", Tahoma, sans-serif; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #phone { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; background: #f3d9c8; }
      body.capture #phone { height: 1280px; width: 720px; max-width: none; }
      body.capture { align-items: flex-start; justify-content: flex-start; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .overlay { position: absolute; inset: 0; pointer-events: none; color: #fff; }
      .overlay svg { display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }
      .top-tabs { position: absolute; top: 26px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
      .top-tabs .dim { opacity: 0.65; font-weight: 400; }
      .top-tabs .on { border-bottom: 4px solid #fff; padding-bottom: 4px; }
      .rail { position: absolute; left: 20px; bottom: 210px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      .rail .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .rail .count { font-size: 21px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.45); }
      #likeIcon path { fill: #fff; }
      #likeIcon.liked path { fill: #ff2b54; }
      .avatar { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #fff; overflow: hidden; position: relative; background: #e3d2b8; }
      .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; }
      .avatar .plus { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%; background: #ff2b54; color: #fff; font-size: 24px; font-weight: 700; line-height: 28px; text-align: center; }
      .disc { width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #3a3a3a 18%, #111 40%, #2c2c2c 60%, #111 80%); border: 5px solid #191919; display: flex; align-items: center; justify-content: center; }
      .disc img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: 50% 8%; }
      .bottom-info { position: absolute; right: 24px; bottom: 92px; max-width: 74%; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
      .bottom-info .user { font-size: 28px; font-weight: 800; }
      .bottom-info .caption { font-size: 24px; font-weight: 400; margin-top: 4px; line-height: 1.45; }
      .bottom-info .music { display: flex; align-items: center; gap: 8px; font-size: 21px; margin-top: 8px; }
      .progress { position: absolute; bottom: 34px; left: 22px; right: 22px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; }
      .progress .bar { height: 100%; width: 0%; background: #fff; border-radius: 3px; }
      .watermark { position: absolute; top: 84px; right: 24px; font-size: 22px; font-weight: 700; opacity: 0.85; text-shadow: 0 2px 6px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 6px; }
      .endcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 0; transform: scale(0.85); background: radial-gradient(circle at 50% 45%, rgba(60,25,35,0) 30%, rgba(60,25,35,0.45) 100%); }
      .endcard .name { font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 4px 24px rgba(138,50,68,0.8), 0 2px 6px rgba(0,0,0,0.4); letter-spacing: 2px; }
      .endcard .sub { font-size: 30px; font-weight: 700; color: #ffe9c9; text-shadow: 0 2px 8px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
      .live-controls { position: fixed; bottom: 14px; right: 50%; transform: translateX(50%); display: flex; gap: 10px; z-index: 5; }
      body.capture .live-controls { display: none; }
      .live-controls a, .live-controls button { font-family: inherit; font-size: 14px; font-weight: 700; background: rgba(255,250,244,0.9); color: #7e2f40; border: none; border-radius: 999px; padding: 9px 18px; cursor: pointer; text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
    </style>
    <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  </head>
  <body>
    <div id="phone">
      <canvas id="stage"></canvas>
      <div class="overlay">
        <div class="top-tabs"><span class="dim">المتابَعون</span><span class="on">لك</span></div>
        <div class="watermark">
          <bdi dir="ltr">@hager</bdi>
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#ffd34d" d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4h4c.8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.4 3.6 3.8 6.8C19.5 16.1 12 21 12 21z" transform="scale(0.9) translate(1.3,1.3)"/></svg>
        </div>
        <div class="rail">
          <div class="item"><div class="avatar"><img src="./assets/hager-figurine.webp" alt="" /><div class="plus">+</div></div></div>
          <div class="item">
            <svg id="likeIcon" width="52" height="52" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4h4c.8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.4 3.6 3.8 6.8C19.5 16.1 12 21 12 21z"/></svg>
            <span class="count" id="likeCount">12.4K</span>
          </div>
          <div class="item">
            <svg width="50" height="50" viewBox="0 0 24 24"><path fill="#fff" d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.7 6.7-.1 1.2-.6 2.6-1.6 3.6 1.9-.2 3.6-1 4.7-1.8 1 .3 2.1.4 3.2.4 5.5 0 10-3.9 10-8.9S17.5 3 12 3z"/></svg>
            <span class="count">842</span>
          </div>
          <div class="item">
            <svg width="48" height="48" viewBox="0 0 24 24"><path fill="#fff" d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.2L5 21V4a1 1 0 0 1 1-1z"/></svg>
            <span class="count">307</span>
          </div>
          <div class="item">
            <svg width="50" height="50" viewBox="0 0 24 24"><path fill="#fff" d="M13.5 4.5 21 12l-7.5 7.5v-4.2C7.8 15.3 4.4 17 2 20c.6-6.3 4.6-10.6 11.5-11.3z"/></svg>
            <span class="count">مشاركة</span>
          </div>
          <div class="disc" id="disc"><img src="./assets/hager-figurine.webp" alt="" /></div>
        </div>
        <div class="bottom-info">
          <div class="user"><bdi dir="ltr">@hager</bdi></div>
          <div class="caption">بترقص على Good Life<br/>#رقص #hager #GoodLife</div>
          <div class="music">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M9 3v10.6A4 4 0 1 0 11 17V7l8-2v6.6A4 4 0 1 0 21 15V3z" transform="scale(0.95)"/></svg>
            <span>Good Life — Kanye West ft. T-Pain</span>
          </div>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div id="bigHeart" style="position:absolute; top:44%; left:50%; opacity:0; transform:translate(-50%,-50%);">
          <svg width="190" height="190" viewBox="0 0 24 24"><path fill="#ff2b54" d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4h4c.8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.4 3.6 3.8 6.8C19.5 16.1 12 21 12 21z"/></svg>
        </div>
        <div class="endcard" id="endcard">
          <div class="name">Hager</div>
          <div class="sub">
            <svg width="26" height="26" viewBox="0 0 24 24"><path fill="#ffd34d" d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>
            <span>تابعوني للمزيد</span>
            <svg width="26" height="26" viewBox="0 0 24 24"><path fill="#ffd34d" d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>
          </div>
        </div>
      </div>
    </div>
    <div class="live-controls">
      <button id="replayBtn">إعادة التشغيل ↺</button>
      <a id="dlLink" href="./assets/hager-dance.mp4" download>تحميل الفيديو MP4 ⬇</a>
      <a href="./index.html">المجسم التفاعلي ←</a>
    </div>
    <script type="module" src="./dance.js"></script>
  </body>
</html>
