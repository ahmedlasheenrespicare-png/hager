:root {
  --navy: #13253f;
  --navy-deep: #0d1b2e;
  --gold: #e8c877;
  --gold-deep: #b8912f;
  --ink: #1d2c42;
  --glass: rgba(255, 252, 246, 0.82);
  --glass-border: rgba(255, 255, 255, 0.7);
  --shadow: 0 10px 30px rgba(13, 27, 46, 0.25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
  background: #f4ead8;
  color: var(--ink);
}

#app { position: fixed; inset: 0; }

#stage {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block; touch-action: none;
}

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

/* Loader */
#loader {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column; gap: 18px;
  align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0d1b2e, #13253f 60%, #0a1524);
  color: var(--gold);
  font-weight: 700; font-size: 1.05rem;
  transition: opacity 0.6s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
.spinner {
  width: 54px; height: 54px; border-radius: 50%;
  border: 4px solid rgba(232, 200, 119, 0.25);
  border-top-color: var(--gold);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Title */
.title-card {
  position: absolute; top: 16px; right: 16px; z-index: 10;
  padding: 12px 20px 13px;
  max-width: min(430px, calc(100vw - 32px));
}
.title-card h1 {
  margin: 0; font-size: 1.25rem; font-weight: 800;
  color: var(--navy);
}
.title-card p { margin: 2px 0 0; font-size: 0.8rem; opacity: 0.75; }

/* Hint */
.hint {
  position: absolute; top: 16px; left: 16px; z-index: 10;
  padding: 9px 16px;
  font-size: 0.78rem; font-weight: 600;
  max-width: min(400px, 46vw);
  transition: opacity 1.2s ease;
}
.hint.fade { opacity: 0; pointer-events: none; }

/* View switcher */
.viewbar {
  position: absolute; top: 92px; right: 16px; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 8px;
  max-width: min(430px, calc(100vw - 32px));
}
.view {
  font-family: inherit; font-size: 0.82rem; font-weight: 700;
  padding: 7px 14px; border-radius: 12px;
  border: 1px solid rgba(19, 37, 63, 0.18);
  background: rgba(255, 255, 255, 0.6);
  color: var(--navy); cursor: pointer;
  transition: all 0.18s ease;
}
.view:hover { background: rgba(232, 200, 119, 0.35); }
.view.active {
  background: linear-gradient(135deg, var(--navy), #1d3a63);
  color: var(--gold); border-color: var(--navy);
}

/* Toolbar */
.toolbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 10;
  display: flex; gap: 6px; padding: 8px;
  max-width: calc(100vw - 24px);
  flex-wrap: wrap; justify-content: center;
}
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: inherit; font-size: 0.72rem; font-weight: 700;
  padding: 8px 13px; border-radius: 13px;
  border: 1px solid rgba(19, 37, 63, 0.15);
  background: rgba(255, 255, 255, 0.6);
  color: var(--navy); cursor: pointer; text-decoration: none;
  transition: all 0.18s ease;
}
.tool .ico { font-size: 1.05rem; line-height: 1; }
.tool:hover { background: rgba(232, 200, 119, 0.4); transform: translateY(-2px); }
.tool.active { background: rgba(232, 200, 119, 0.55); border-color: var(--gold-deep); }
.tool.primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  color: var(--navy-deep); border-color: var(--gold-deep);
}

/* Toast */
#toast {
  position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
  z-index: 20;
  background: var(--navy); color: var(--gold);
  font-size: 0.85rem; font-weight: 700;
  padding: 9px 20px; border-radius: 999px;
  box-shadow: var(--shadow);
  white-space: nowrap;
}

@media (max-width: 760px) {
  .title-card { padding: 9px 14px; }
  .title-card h1 { font-size: 1rem; }
  .title-card p { font-size: 0.68rem; }
  .hint { display: none; }
  .viewbar { top: 76px; }
  .view { font-size: 0.72rem; padding: 6px 10px; }
  .tool .lbl { display: none; }
  .tool { padding: 9px 12px; }
}

/* headless capture mode */
body.capture .glass, body.capture #loader, body.capture #toast { display: none !important; }

</style>
